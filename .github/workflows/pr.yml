name: pr

# The required check of a pull request to main, `pr-gate`: lint, typecheck and the unit tests.
# Runs on the pull request and again on the merge queue's merged result (merge_group).
# The full suite (suite.yml) runs on main after each merge.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run

  pr-gate:
    if: ${{ always() }}
    needs: [lint, typecheck, unit]
    runs-on: ubuntu-latest
    steps:
      - name: every check green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error title=pr-gate::a check did not pass ($RESULTS)"; exit 1; }; done
