id: T920
release_note: internal
repo: openisd
owner: agent
status: ready
label: fixes
goal: >-
  Main is red since T916 (input-limits sweep phase 2). An ABC box whose rear tuning the rear port cannot reach shows its
  reason both in the Vent length field's popup and on the chart's "Can't plot" panel, as the front port and the vented box
  already do. The spec counts the message inside the field's popup only and also checks the chart shows the same reason, on
  desktop and on the phone's Graph tab, for the ABC rear port, the ABC front port and the vented box. No app behaviour changes.
why: >-
  John, 19 Nov 2026, board item QO955.c3: "if a chart cannot be drawn then the chart should show the reason message, and the
  related fields also, this is particularly important on the mobile where we can't see the chart and fields at the same time".
  So the message on both the chart and the field is intended; the spec's page-wide "once" count was the stale part.
  Options A (the rear port draws again) and B (the chart only points to the box) are rejected.
done_test: bash scripts/test-browser.sh packages/ui/test/ui/abc-vent-message.browser.spec.ts
files:
