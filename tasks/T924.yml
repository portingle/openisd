goal: "A value a project file holds that no design can use is repaired automatically when the project opens (OpenISD file, WinISD .wpr, stored project) and named once in the opening message, with no warning mark on its box: air pressure, sound velocity or density at or below 0, humidity outside 0-100 % and temperature at or below 0 K are emptied (the app's air, or worked out from it); a port tuning at or below 0 Hz is worked out from the port length the file gave; a negative port length is worked out from the tuning; a loss Q at or below 0 takes WinISD's default; a driver or radiator count below 1 becomes 1; a negative series resistance or added mass becomes 0. Typed humidity outside 0-100 % and typed temperature at or below 0 K are refused with a note; an air value outside its normal band is kept and used with a warning naming the band."
