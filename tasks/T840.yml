id: T840
release_note: 'A passive-radiator editor on both skins: name and the radiator''s own figures, with OK, Cancel and Save to My PRs. The Select popup''s Define new passive radiator button opens it on a blank radiator. The phone Box tab shows the radiator by name (tap to edit) instead of its figures; the desktop Passive Radiator page keeps its figures and gains an Edit button.'
repo: openisd
owner: prdefine-agent
status: in_progress
goal: One passive-radiator editor, both skins (name, Vas, Qms, Fs, Sd, Mms, Cms, Rms, Xmax; OK, Cancel, Save to My PRs). The Select popup's Define button opens it on a blank radiator; the phone Box tab shows the radiator by name (a row that opens the editor) instead of its figures; the desktop Passive Radiator page keeps its figures and gains an Edit button
