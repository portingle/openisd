id: T902
release_note: The Driver Editor's formula panel shows the formulas the engine really uses; the New-project wizard keeps the exact sealed volume for a picked Qtc, as the Box tab does; a new passive-radiator project's placeholder radiator meets the 2× rule for any number of drivers.
repo: openisd
owner: t902-engine-copies
status: open
goal: The copies of engine logic that give users different answers are gone - the formula panel comes from the engine's routes, both sealed pickers store the engine's volume, and the starting radiator is sized by the engine to its own 2x rule
why: "Duplicate-logic scan of 18 Nov 2026 (_agent_files/dupscan/REPORT.md findings 4, 5, 6), assigned by the lead session as T902; John's rules: the engine does the calculations, the UI is display only (27 Sep), the 2x rule (16 Nov). bugs/BUG_20261118_formula-panel-is-a-hand-typed-copy-of-the-engine.md, bugs/BUG_20261118_wizard-rounds-the-picked-sealed-volume.md, bugs/BUG_20261118_dummy-radiator-sized-by-a-1x-rule-the-2x-line-contradicts.md"
